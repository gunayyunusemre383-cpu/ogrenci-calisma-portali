    const PORTAL_BULLETINS = {"daily":[{"dateIso":"2026-11-19","fileSlug":"19_Kasim_2026","dateTr":"19 Kasım 2026","dayName":"Perşembe","badge":"19 KASIM","title":"10 Aralık PPK Öncesi %35 Faiz Fiyatlaması, Ons Altın \u0026 Tüketici Eğilimi","subtitle":"PPK öncesi piyasa fiyatlamaları, TCMB sıkı duruş mesajları, küresel rezerv talebi ve hane halkı bütçe dengesi","focus":"10 Aralık PPK Beklentileri, Rezervler, Altın \u0026 Tüketici Dengesi","sections":[{"icon":"🏦","title":"1. Türkiye Ekonomisi \u0026 10 Aralık PPK Fiyatlamaları","items":["\u003cstrong\u003ePolitika Faizi Beklentisi (%36 -\u003e %35):\u003c/strong\u003e Ekim ayı PPK toplantısında politika faizini 100 baz puan indirerek \u003cstrong\u003e%36\u003c/strong\u003e seviyesine çeken TCMB için Kasım ayında olağan PPK toplantısı bulunmuyor; piyasalar gözünü \u003cstrong\u003e10 Aralık 2026\u003c/strong\u003e toplantısına çevirmiş durumda.","\u003cstrong\u003eAnket Konsensüsü:\u003c/strong\u003e Enflasyon Raporu\u0027ndaki yukarı yönlü yıl sonu revizyonuna (%29,5) rağmen Piyasa Katılımcıları Anketi katılımcılarının ağırlıklı beklentisi Aralık ayında 100 baz puanlık ölçülü bir indirimle politika faizinin \u003cstrong\u003e%35\u003c/strong\u003e\u0027e çekilmesi yönünde.","\u003cstrong\u003eDöviz Kuru Beklentisi:\u003c/strong\u003e Katılımcıların yıl sonu Dolar/TL beklentisi \u003cstrong\u003e51,61 TL\u003c/strong\u003e, 12 ay sonrası için ise \u003cstrong\u003e60,77 TL\u003c/strong\u003e düzeyinde oluştu; sıkı likidite yönetimi TL mevduat cazibesini koruyor."]},{"icon":"🌍","title":"2. Küresel Merkez Bankaları (Fed, ECB, BoJ)","items":["\u003cstrong\u003eFed (ABD):\u003c/strong\u003e İstihdam verilerinin direncini koruması ve hizmet enflasyonundaki yapışkanlık sebebiyle Fed yetkilileri Aralık öncesi faiz patikasında sabırlı kalma mesajını yineliyor.","\u003cstrong\u003eECB (Euro Bölgesi):\u003c/strong\u003e Zayıf sanayi üretimi karşısında büyüme endişeleri öne çıkarken, yüksek enerji maliyetleri manşet enflasyonda aşağı yönlü hızı sınırlıyor.","\u003cstrong\u003eKüresel Büyüme Varsayımı:\u003c/strong\u003e TCMB\u0027nin baz senaryo projeksiyonlarında küresel büyüme varsayımı 2026 için \u003cstrong\u003e%1,6\u003c/strong\u003e, 2027 için \u003cstrong\u003e%2,5\u003c/strong\u003e seviyesinde sabit tutuldu."]},{"icon":"🥇","title":"3. Altın, Brent Petrol \u0026 Güvenli Liman Talebi","items":["\u003cstrong\u003eOns Altın:\u003c/strong\u003e Merkez bankalarının rezerv çeşitlendirme alımları, jeopolitik riskler ve enflasyondan korunma talebi altındaki güçlü seyrin ana taşıyıcısı olmayı sürdürüyor.","\u003cstrong\u003eBrent Petrol:\u003c/strong\u003e 2026 yılı ortalama petrol varsayımının \u003cstrong\u003e97,2 dolar\u003c/strong\u003e bandına çekildiği bir konjonktürde ham petrol fiyatlarındaki katılık enerji ithalatçısı ekonomilerde maliyet baskısını canlı tutuyor."]},{"icon":"📊","title":"4. BIST 100 ve Sektörel Ayrışma","items":["\u003cstrong\u003eBankacılık \u0026 Holdingler:\u003c/strong\u003e Dezenflasyon patikası ve beklenen ölçülü faiz indirim döngüsü orta vadeli net faiz marjı beklentilerini gündemde tutuyor.","\u003cstrong\u003eSavunma \u0026 Teknoloji:\u003c/strong\u003e Yüksek sipariş bakiyeleri ve küresel Tech Capex rüzgarı sanayi endeksindeki seçici hisseleri desteklemeye devam ediyor."]}],"econTitle":"Tüketici Dengesi (MUx/Px = MUy/Py), Gelir Etkisi \u0026 İkame Etkisi","econNote":"Yüksek nominal faiz ortamında tasarruf ile bugünkü tüketim arasındaki tercih doğrudan \u003cstrong\u003efırsat maliyetine\u003c/strong\u003e bağlıdır. Enflasyon beklentisi yüksekken hanehalkı marjinal fayda oranını (\u003ccode\u003eMUx / Px = MUy / Py\u003c/code\u003e) dengelemek için fiyatı görece az artan mallara ve nakit benzeri getirilere yönelir; faizlerin düşeceği beklentisi güçlendiğinde ise geleceğin bugünkü tüketim karşısındaki göreli fiyatı değiştiğinden \u003cstrong\u003eikame etkisi\u003c/strong\u003e devreye girer."},{"dateIso":"2026-11-18","fileSlug":"18_Kasim_2026","dateTr":"18 Kasım 2026","dayName":"Çarşamba","badge":"18 KASIM","title":"Yapay Zeka Altyapı Yatırımları (Tech Capex), Çip Bilançoları \u0026 Sanayi PMI","subtitle":"Yarı iletken talebindeki rekor sermaye harcamaları ile geleneksel imalat sanayisi arasındaki küresel makas","focus":"Tech Capex, Yarı İletkenler, Küresel PMI \u0026 Verimlilik","sections":[{"icon":"🚀","title":"1. Yapay Zeka Veri Merkezi \u0026 Çip Sermaye Harcamaları","items":["\u003cstrong\u003eSermaye Harcamalarında İvme:\u003c/strong\u003e Büyük teknoloji şirketlerinin veri merkezi, yüksek hızlı bellek ve yapay zeka hızlandırıcılarına ayırdığı bütçeler küresel sabit sermaye yatırımlarının ana taşıyıcısı olmaya devam ediyor.","\u003cstrong\u003eTedarik Zinciri \u0026 Enerji Talebi:\u003c/strong\u003e Veri merkezlerinin artan elektrik tüketimi enerji altyapısı ve bakır gibi endüstriyel metaller için yapısal bir talep zemini yaratıyor."]},{"icon":"🏭","title":"2. Küresel İmalat vs Hizmetler Ayrışması","items":["\u003cstrong\u003eİmalat Sanayisi:\u003c/strong\u003e Yüksek borçlanma maliyetleri ve Avrupa\u0027daki enerji giderleri geleneksel imalat PMI verilerini eşik değer olan 50\u0027nin etrafında baskılamayı sürdürüyor.","\u003cstrong\u003eHizmet Sektörü:\u003c/strong\u003e Dijital hizmetler, yazılım ve yüksek katma değerli lojistik kalemleri küresel büyümenin \u003cstrong\u003e%3,1\u003c/strong\u003e bandında tutunmasına katkı sağlıyor."]},{"icon":"🇹🇷","title":"3. Türkiye Sanayi Üretimi \u0026 İhracat Pazarları","items":["\u003cstrong\u003eAvrupa Talebi Belirleyici:\u003c/strong\u003e Türkiye\u0027nin en büyük ihracat pazarı olan Euro Bölgesi\u0027ndeki zayıf büyüme, otomotiv ve beyaz eşya dış satımında birim marjları kritik hale getiriyor.","\u003cstrong\u003eOrta Vadeli Rekabetçilik:\u003c/strong\u003e Girdi maliyetlerindeki artışa rağmen cari açığın 2026 sonunda \u003cstrong\u003e46,1 milyar dolar\u003c/strong\u003e bandına iyileşmesi beklentisi dış denge açısından olumlu okunuyor."]}],"econTitle":"Üretim İmkânları Eğrisi (PPF) ve Teknolojik Verimlilik Şoku","econNote":"Ekonomi 101\u0027de \u003cstrong\u003ePPF (Üretim İmkânları Eğrisi)\u003c/strong\u003e mevcut teknoloji ve kaynaklarla üretilebilecek maksimum çıktıyı gösterir. Yapay zeka ve yarı iletkenlere yapılan sermaye harcamaları (\u003cstrong\u003eTech Capex\u003c/strong\u003e), kısa vadede cari tüketimden feragat edip yatırım malı üretmek (PPF üzerinde noktayı kaydırmak) anlamına gelir; orta-uzun vadede ise toplam faktör verimliliğini artırarak \u003cstrong\u003ePPF eğrisinin tamamını sağa/dışa kaydırarak\u003c/strong\u003e ekonomik büyüme yaratır."},{"dateIso":"2026-11-17","fileSlug":"17_Kasim_2026","dateTr":"17 Kasım 2026","dayName":"Salı","badge":"17 KASIM","title":"Bütçe Disiplini, Para-Maliye Politikası Eşgüdümü ve Dezenflasyon Patikası","subtitle":"Sıkı para politikasının bütçe dengesiyle desteklenmesi, kamu harcama kompozisyonu ve gıda enflasyonu riskleri","focus":"Maliye Politikası, Gıda Enflasyonu \u0026 Dezenflasyon","sections":[{"icon":"🏛️","title":"1. Para ve Maliye Politikası Eşgüdümü","items":["\u003cstrong\u003eSıkı Duruş Vurgusu:\u003c/strong\u003e TCMB Başkanı Fatih Karahan\u0027ın Enflasyon Raporu sunumunda altını çizdiği gibi, 2026 sonu tahmininin \u003cstrong\u003e%29,5\u003c/strong\u003e\u0027e güncellenmesi gevşeme sinyali değil; maliye politikası ile eşgüdüm içinde fiyat istikrarına kadar sıkı duruşun süreceği mesajı taşıyor.","\u003cstrong\u003eOrta Vadeli Tahminler:\u003c/strong\u003e TCMB\u0027nin 2027 yıl sonu enflasyon projeksiyonu \u003cstrong\u003e%21\u003c/strong\u003e, 2028 tahmini \u003cstrong\u003e%13,5\u003c/strong\u003e ve nihai %5 hedefi ise değişmeden korundu."]},{"icon":"🌾","title":"2. Gıda Fiyatları \u0026 Arz Yönlü Baskılar","items":["\u003cstrong\u003eGıda Enflasyonu Varsayımı (%31,3):\u003c/strong\u003e TCMB 2026 yılı gıda enflasyonu varsayımını \u003cstrong\u003e%31,3\u003c/strong\u003e seviyesinde belirleyerek işlenmemiş gıda ve tarımsal girdi maliyetlerinin manşet TÜFE üzerindeki belirleyiciliğine dikkat çekti.","\u003cstrong\u003eHane Halkı Sepeti:\u003c/strong\u003e Gıda ve konut harcamalarının düşük-orta gelir grubu sepetindeki yüksek ağırlığı nedeniyle tüketicilerin hissettiği enflasyon beklentisi manşet verinin üzerinde kalmaya devam ediyor."]},{"icon":"⚖️","title":"3. Borçlanma Maliyetleri ve Tahvil İhaleleri","items":["\u003cstrong\u003eReel Getiri Dengesi:\u003c/strong\u003e Kamu iç borçlanma ihalelerinde talep güçlü kalırken, piyasa faizleri ile beklenen enflasyon (%24,04 / 12 ay sonrası) arasındaki reel pozitif bölge yabancı portföy ilgisinin temel çıpası oldu."]}],"econTitle":"Maliye Politikası Çarpanı \u0026 Dışlama Etkisi (Crowding-Out Effect)","econNote":"Enflasyonla mücadele döneminde genişlemeci maliye politikası (kamu harcamalarının aşırı artması) Toplam Talebi (AD) sağa iterek enflasyonla mücadeleyi zorlaştırır ve faizleri yukarı çekip özel sektör yatırımlarını dışlar (\u003cstrong\u003eCrowding-Out\u003c/strong\u003e). Dezenflasyon için sıkı para politikasının bütçe disiplini ile desteklenmesi gerekir."},{"dateIso":"2026-11-16","fileSlug":"16_Kasim_2026","dateTr":"16 Kasım 2026","dayName":"Pazartesi","badge":"16 KASIM","title":"Küresel Tahvil Getirileri, Fed Mesajları \u0026 Hafta Açılışı","subtitle":"Haftanın açılışında ABD 10 yıllık tahvil faizleri, gelişmekte olan piyasalara sermaye akımları ve kur dengesi","focus":"Tahvil Piyasası, Fed İletişimi \u0026 Fisher Denklemi","sections":[{"icon":"📈","title":"1. Küresel Tahvil Piyasası \u0026 Risk İştahı","items":["\u003cstrong\u003eABD 10 Yıllıklar:\u003c/strong\u003e Fed\u0027in faiz indirim döngüsünde aceleci olmayacağı beklentisi uzun vadeli tahvil getirilerini yüksek platoda tutuyor; bu durum gelişmekte olan ülke risk primleri (CDS) üzerinde seçici fiyatlamalara yol açıyor.","\u003cstrong\u003eKüresel Likidite:\u003c/strong\u003e BoJ\u0027un kademeli sıkılaşma adımları ile Fed\u0027in temkinli patikası küresel carry-trade akımlarında oynaklığı artırıyor."]     function renderBulletin(kind, idx) {
      const container = document.getElementById('bultenContent');
      const data = kind === 'weekly' ? PORTAL_BULLETINS.weekly[idx] : PORTAL_BULLETINS.daily[idx];
      if (!data) return;

      document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + kind + '-' + idx);
      if (activeBtn) activeBtn.classList.add('active');

      const metaText = kind === 'weekly'
        ? '📊 HAFTALIK MAKRO ÖZET • ' + data.weekLabel
        : '📅 GÜNLÜK EKONOMİ BÜLTENİ • ' + data.dateTr + ' (' + data.dayName + ')';

      let html = `
        <div class="bulletin-header">
          <div class="b-meta">${metaText}</div>
          <div class="b-title">${data.title}</div>
          <div class="b-sub">${data.subtitle}</div>
        </div>
      `;

      data.sections.forEach(sec => {
        const lis = sec.items.map(it => `<li>${it}</li>`).join('');
        html += `<div class="card"><h3>${sec.icon} ${sec.title}</h3><ul>${lis}</ul></div>`;
      });

      if (data.econTitle && data.econNote) {
        html += `
          <div class="econ-box">
            <h4>💡 ECON 101 Bağlantısı: ${data.econTitle}</h4>
            <p>${data.econNote}</p>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    (function init() {
      const bar = document.getElementById('bultenTabs');
      PORTAL_BULLETINS.daily.forEach((d, idx) => {
        const btn = document.createElement('button');
        btn.className = 'day-btn' + (idx === 0 ? ' active' : '');
        btn.id = 'btn-daily-' + idx;
        btn.textContent = d.badge;
        btn.onclick = () => renderBulletin('daily', idx);
        bar.appendChild(btn);
      });
      PORTAL_BULLETINS.weekly.forEach((w, idx) => {
        const btn = document.createElement('button');
        btn.className = 'day-btn weekly';
        btn.id = 'btn-weekly-' + idx;
        btn.textContent = '📊 ' + w.badge;
        btn.onclick = () => renderBulletin('weekly', idx);
        bar.appendChild(btn);
      });
      renderBulletin('daily', 0);
    })();
  </script>
